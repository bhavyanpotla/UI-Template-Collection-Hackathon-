<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Prediction Risk Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <h1>ML Prediction Risk Dashboard</h1>
    <div class="cards">
      <div class="card high-risk">
        <h3>Customer Churn Risk</h3>
        <p class="score">88%</p>
        <span class="badge">High Risk</span>
      </div>
      <div class="card low-risk">
        <h3>Fraud Detection</h3>
        <p class="score">12%</p>
        <span class="badge">Low Risk</span>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
